name: 验证插件市场

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 验证 (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: 验证市场和插件
        run: python scripts/validate_repo.py
      - name: 运行生命周期脚本测试
        run: python -m unittest discover -s tests -v

  validate-mcp-adapter:
    name: 验证 MCP Adapter（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: 安装锁定依赖
        run: python -m pip install --require-hashes --requirement services/mem0-mcp/requirements.lock
      - name: 检查依赖一致性
        run: python -m pip check
      - name: 运行 Adapter 鉴权与工具测试
        working-directory: services/mem0-mcp
        run: python -m unittest -v test_adapter.py

  validate-mem0-server:
    name: 验证 Mem0 服务与迁移（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: mem0_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -d mem0_app -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-not-a-secret
      POSTGRES_DB: mem0_app
      APP_DB_NAME: mem0_app
      POSTGRES_COLLECTION_NAME: mem0_ci_memories
      LLM_API_KEY: ci-not-a-secret
      LLM_API_BASE: https://example.invalid/v1
      EMBEDDING_API_KEY: ci-not-a-secret
      EMBEDDING_API_BASE: https://example.invalid/v1
      JWT_SECRET: ci-only-placeholder-not-a-secret-32-bytes
      MEM0_INTERNAL_SERVICE_KEY: ci-only-placeholder-not-a-secret
      MEM0_TELEMETRY: "false"
      HISTORY_DB_PATH: /tmp/mem0-ci-history.db
      MEM0_TEST_RESTART_STATE_PATH: /tmp/mem0-restart-state.json
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: 物化固定 Mem0 源码
        run: python scripts/materialize_mem0.py .mem0-source
      - name: 安装锁定依赖
        run: python -m pip install --require-hashes --requirement .mem0-source/server/requirements.lock
      - name: 检查依赖一致性
        run: python -m pip check
      - name: 验证数据库迁移往返
        working-directory: .mem0-source/server
        run: |
          alembic upgrade 006
          alembic upgrade 008
          alembic downgrade 006
          alembic upgrade 008
      - name: 运行 Mem0 服务单元测试
        working-directory: .mem0-source/server
        run: python -m unittest -v test_main.py
      - name: 验证 PGVector 类型过滤
        working-directory: .mem0-source/server
        env:
          PYTHONPATH: ..
        run: python test_main.py verify-pgvector-filter-integration
      - name: 验证 5001 条回填和迁移锁
        working-directory: .mem0-source/server
        run: python test_main.py verify-backfill-integration
      - name: 准备跨进程恢复状态
        working-directory: .mem0-source/server
        run: python test_main.py prepare-restart
      - name: 验证跨进程恢复状态
        working-directory: .mem0-source/server
        run: python test_main.py verify-restart

  validate-dashboard:
    name: 验证 Dashboard（Node 22）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: 设置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: 物化固定 Mem0 源码
        run: python scripts/materialize_mem0.py .mem0-source
      - name: 启用锁定的 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.2 --activate
      - name: 冻结安装 Dashboard 依赖
        working-directory: .mem0-source/server/dashboard
        run: pnpm install --frozen-lockfile
      - name: 检查 Dashboard 格式
        working-directory: .mem0-source/server/dashboard
        run: pnpm run lint
      - name: 检查 Dashboard 类型
        working-directory: .mem0-source/server/dashboard
        run: pnpm run typecheck
      - name: 构建 Dashboard
        working-directory: .mem0-source/server/dashboard
        run: pnpm run build
      - name: 审计 Dashboard 生产依赖
        working-directory: .mem0-source/server/dashboard
        run: pnpm audit --prod --audit-level=high
      - name: 验证 Dashboard 运行镜像
        working-directory: .mem0-source/server/dashboard
        run: |
          set -euo pipefail
          image="mem0-dashboard-ci:${GITHUB_SHA}"
          container="mem0-dashboard-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker build --tag "$image" .
          docker run --detach --name "$container" --network none \
            --env NEXT_PUBLIC_API_URL=https://example.invalid \
            --env NEXT_PUBLIC_INSTANCE_NAME=Mem0 \
            "$image"
          for _ in $(seq 1 30); do
            if docker exec "$container" wget -qO- http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

  build-arm64:
    name: 构建 ARM64 镜像（${{ matrix.name }}）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mem0
            context: .mem0-source
            file: .mem0-source/server/prod.Dockerfile
          - name: MCP Adapter
            context: services/mem0-mcp
            file: services/mem0-mcp/Dockerfile
          - name: Dashboard
            context: .mem0-source/server/dashboard
            file: .mem0-source/server/dashboard/Dockerfile
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 设置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: 物化固定 Mem0 源码
        run: python scripts/materialize_mem0.py .mem0-source
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v4
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4
      - name: 构建镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: false
