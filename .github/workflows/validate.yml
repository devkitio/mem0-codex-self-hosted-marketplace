name: 验证插件市场

on:
  push:
  pull_request:

jobs:
  validate:
    name: 验证 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: 验证市场和插件
        run: python scripts/validate_repo.py
      - name: 运行生命周期脚本测试
        run: python -m unittest discover -s tests -v

  validate-mcp-adapter:
    name: 验证 MCP Adapter（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装锁定依赖
        run: python -m pip install --requirement services/mem0-mcp/requirements.lock
      - name: 检查依赖一致性
        run: python -m pip check
      - name: 运行 Adapter 鉴权与工具测试
        working-directory: services/mem0-mcp
        run: python -m unittest -v test_adapter.py
